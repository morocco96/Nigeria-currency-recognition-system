<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Scan History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="dark-bg">

<ion-list>

  <ion-item>
    <ion-thumbnail slot="start">
      <img src="/assets/images/1000 naria.jpg">
    </ion-thumbnail>

    <ion-label>
      <h2>1000 Naira</h2>
      <p>Recognized Successfully</p>
      <small>2 minutes ago</small>
    </ion-label>

    <ion-icon name="checkmark-circle" color="success"></ion-icon>
  </ion-item>


  <ion-item>
    <ion-thumbnail slot="start">
      <img src="./assets/images/50 naira - Copy.jpg">
    </ion-thumbnail>

    <ion-label>
      <h2>500 Naira</h2>
      <p>Recognized Successfully</p>
      <small>10 minutes ago</small>
    </ion-label>

    <ion-icon name="checkmark-circle" color="success"></ion-icon>
  </ion-item>


  <ion-item>
    <ion-thumbnail slot="start">
      <img src="./assets/images/1000 naria.jpg">
    </ion-thumbnail>

    <ion-label>
      <h2>Unknown Note</h2>
      <p>Insufficient Lighting</p>
    </ion-label>

    <ion-icon name="close-circle" color="danger"></ion-icon>
  </ion-item>

</ion-list>

</ion-content>
